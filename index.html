<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Ultra Call - Mobile Protected</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(17, 24, 39, 0.85);
            --danger: #f43f5e;
            --text-main: #f3f4f6;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        h2 { margin: 5px 0 10px 0; font-size: 1.2rem; color: #f43f5e; }

        .display-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 9/16;
            max-height: 52vh;
            background: #030712;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Anti-Screenshot Overlay Shield */
        .security-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 20;
            pointer-events: none;
        }

        .local-pip {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 90px;
            height: 130px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
            z-index: 10;
        }

        .local-pip video { transform: scaleX(-1); }

        .controls-bar {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            max-width: 480px;
            width: 100%;
            margin-top: 12px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .ctrl-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }

        .disconnect-btn { background: var(--danger); border: none; font-size: 20px; }

        .chat-container {
            max-width: 480px;
            width: 100%;
            margin-top: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
        }

        .chat-messages { height: 60px; overflow-y: auto; background: #030712; padding: 6px; font-size: 0.85rem; }
        .chat-input-area { display: flex; gap: 6px; }
        .chat-input-area input { flex: 1; background: #030712; border: 1px solid var(--border); color: white; padding: 6px; }
    </style>
</head>
<body class="secured-lock">

    <h2>Secure Ultra Call</h2>

    <div class="display-container" id="secure-screen">
        <!-- Invisible Shield to intercept/disturb mobile screenshots -->
        <div class="security-shield" id="sec-shield"></div>
        <video id="remote-video" autoplay playsinline controlsList="nodownload nofullscreen noremoteplayback" disablePictureInPicture></video>
        <div class="local-pip">
            <video id="local-video" autoplay muted playsinline></video>
        </div>
    </div>

    <div class="controls-bar">
        <!-- Camera Switch Button -->
        <button class="ctrl-btn" onclick="switchCamera()" title="Switch Camera">🔄</button>
        <!-- Disconnect Button -->
        <button class="ctrl-btn disconnect-btn" onclick="disconnectCall()" title="Disconnect">❌</button>
    </div>

    <div class="chat-container">
        <div class="chat-messages" id="chat-box"></div>
        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

<script>
    // --- Advanced High-Security & Anti-Capture Protections ---
    document.addEventListener('contextmenu', e => e.preventDefault());
    
    document.addEventListener('keydown', (e) => {
        if (e.key === 'F12' || e.key === 'PrintScreen' || (e.ctrlKey && e.key === 'u') || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C'))) {
            e.preventDefault();
            triggerSecurityShield();
        }
    });

    // Detect if user switches tab or tries to record screen via mobile/desktop system switch
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            triggerSecurityShield();
        } else {
            removeSecurityShield();
        }
    });

    function triggerSecurityShield() {
        const screen = document.getElementById('secure-screen');
        if(screen) screen.style.filter = "blur(25px)";
    }

    function removeSecurityShield() {
        const screen = document.getElementById('secure-screen');
        if(screen) screen.style.filter = "none";
    }

    const FIXED_SAMPLE_ID = "suraj_sample_room_999";
    const FIXED_MAIN_ID = "suraj_main_room_999";
    let peer = new Peer(FIXED_SAMPLE_ID);
    let localStream = null;
    let currentCall = null;
    let usingFrontCamera = true;

    peer.on('open', () => {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
            localStream = stream;
            document.getElementById('local-video').srcObject = localStream;
            const call = peer.call(FIXED_MAIN_ID, stream);
            currentCall = call;
            call.on('stream', remoteStream => {
                document.getElementById('remote-video').srcObject = remoteStream;
            });
        }).catch(err => {
            alert("Camera and Microphone permissions are required.");
        });
    });

    async function switchCamera() {
        usingFrontCamera = !usingFrontCamera;
        if(localStream) {
            localStream.getTracks().forEach(t => t.stop());
        }
        try {
            const newStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: usingFrontCamera ? 'user' : 'environment' }, 
                audio: true 
            });
            localStream = newStream;
            document.getElementById('local-video').srcObject = localStream;
            if(currentCall && currentCall.peerConnection) {
                const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if(sender) {
                    sender.replaceTrack(localStream.getVideoTracks()[0]);
                }
            }
        } catch (e) {
            alert("Unable to switch camera.");
        }
    }

    function sendMessage() {
        const input = document.getElementById('msg-input');
        if(!input.value.trim()) return;
        const conn = peer.connect(FIXED_MAIN_ID);
        conn.on('open', () => {
            conn.send(input.value);
            appendChatMessage("You", input.value);
            input.value = '';
        });
    }

    peer.on('connection', (conn) => {
        conn.on('data', (data) => {
            appendChatMessage("Partner", data);
        });
    });

    function appendChatMessage(sender, text) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.innerHTML = `<b>${sender}:</b> ${text}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function disconnectCall() { 
        window.location.reload(); 
    }
</script>
</body>
</html>
