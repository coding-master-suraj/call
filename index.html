<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Ultra Call - Audio/Video Switch</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(17, 24, 39, 0.85);
            --danger: #f43f5e;
            --accent: #10b981;
            --text-main: #f3f4f6;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        h2 {
            margin: 5px 0 10px 0;
            font-size: 1.2rem;
            color: #f43f5e;
        }

        /* Main Display Screen */
        .display-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 9/16;
            max-height: 52vh;
            background: #030712;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #remote-video {
            width: 100%;
            height: 100%;
            background: #111;
        }

        /* Small Corner View for Own Camera (Only for Video Call) */
        .local-pip {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 90px;
            height: 130px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .local-pip video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .placeholder-text {
            position: absolute;
            color: #6b7280;
            font-size: 0.9rem;
            text-align: center;
            pointer-events: none;
        }

        /* Bottom Control Panel */
        .controls-bar {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            max-width: 480px;
            width: 100%;
            margin-top: 12px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }

        .ctrl-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .ctrl-btn:hover {
            transform: scale(1.08);
            background: rgba(51, 65, 85, 1);
        }

        .ctrl-btn.disconnect-btn {
            background: var(--danger);
            width: 50px;
            height: 50px;
            border-radius: 25px;
            font-size: 20px;
        }

        .hidden-by-mode {
            display: none !important;
        }

        /* Text Chat Box Style */
        .chat-container {
            max-width: 480px;
            width: 100%;
            margin-top: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-messages {
            height: 60px;
            overflow-y: auto;
            background: #030712;
            border-radius: 8px;
            padding: 6px;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-input-area {
            display: flex;
            gap: 6px;
        }

        .chat-input-area input {
            flex: 1;
            background: #030712;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 10px;
            color: white;
            font-size: 0.85rem;
            outline: none;
        }

        .chat-input-area button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .status-badge {
            font-size: 0.8rem;
            color: #34d399;
            margin-bottom: 6px;
            font-weight: 600;
        }
    </style>
</head>
<body class="secured-lock">

    <h2>Secure Ultra Call</h2>
    <div class="status-badge" id="status-text">Status: Initializing...</div>

    <!-- Main Screen Display -->
    <div class="display-container" id="secure-screen">
        <div class="placeholder-text" id="screen-placeholder">Connecting Secure Stream...</div>
        
        <!-- Remote Partner Video (Hidden in Audio Mode) -->
        <video id="remote-video" autoplay playsinline></video>
        
        <!-- Small Corner Self View (PiP) (Hidden in Audio Mode) -->
        <div class="local-pip" id="local-pip-box">
            <video id="local-video" autoplay muted playsinline></video>
        </div>
    </div>

    <!-- Bottom Action Bar -->
    <div class="controls-bar">
        <!-- Switch Camera Button (Only visible in Video Call Mode) -->
        <button class="ctrl-btn video-only" id="switch-cam-btn" onclick="switchCamera()" title="Switch Front/Back Camera">🔄</button>
        
        <!-- Call Mode Switch Button (Video <-> Audio) -->
        <button class="ctrl-btn" id="mode-switch-btn" onclick="toggleCallType()" title="Switch Call Type">🎧</button>
        
        <!-- Disconnect Button -->
        <button class="ctrl-btn disconnect-btn" onclick="disconnectCall()" title="Disconnect">❌</button>
    </div>

    <!-- Text Chat Function under Display -->
    <div class="chat-container">
        <div class="chat-messages" id="chat-box">
            <div style="color: #6b7280;">Encrypted chat ready...</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Hidden audio element for audio-only stream handling -->
    <audio id="remote-audio" autoplay></audio>

<script>
    // --- Advanced Security Protections ---
    document.addEventListener('contextmenu', e => e.preventDefault());

    document.addEventListener('keydown', (e) => {
        if (
            e.key === 'F12' ||
            e.key === 'PrintScreen' ||
            (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
            (e.ctrlKey && e.key === 'u') ||
            (e.ctrlKey && e.key === 's')
        ) {
            e.preventDefault();
            triggerSecurityShield();
            return false;
        }
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            triggerSecurityShield();
        } else {
            removeSecurityShield();
        }
    });

    function triggerSecurityShield() {
        const screen = document.getElementById('secure-screen');
        if(screen) screen.style.filter = "blur(20px)";
    }

    function removeSecurityShield() {
        const screen = document.getElementById('secure-screen');
        if(screen) screen.style.filter = "none";
    }

    const FIXED_SAMPLE_ID = "suraj_sample_room_999";
    const FIXED_MAIN_ID = "suraj_main_room_999";

    let peer = new Peer(FIXED_SAMPLE_ID);
    let localStream = null;
    let currentCall = null;
    let dataConnection = null;
    let isVideoCallMode = true;
    let usingFrontCamera = true;

    peer.on('open', () => {
        document.getElementById('status-text').innerText = "Status: Securely Connecting...";
        initMediaAndConnect();
    });

    function initMediaAndConnect() {
        const constraints = { 
            video: isVideoCallMode, 
            audio: true 
        };

        navigator.mediaDevices.getUserMedia(constraints).then(stream => {
            localStream = stream;
            
            if (isVideoCallMode) {
                document.getElementById('local-video').srcObject = localStream;
                document.getElementById('local-pip-box').style.display = 'block';
            } else {
                document.getElementById('local-pip-box').style.display = 'none';
            }
            
            connectToMain(localStream);
            setupDataConnection(FIXED_MAIN_ID);
            updateUIState();
        }).catch(err => {
            alert("Microphone/Camera access is required for this secure session.");
        });
    }

    function connectToMain(stream) {
        const call = peer.call(FIXED_MAIN_ID, stream, { metadata: { type: isVideoCallMode ? 'video' : 'audio' } });
        setupCallEvents(call);
    }

    function setupDataConnection(id) {
        dataConnection = peer.connect(id);
        setupDataEvents(dataConnection);
    }

    peer.on('connection', (conn) => {
        dataConnection = conn;
        setupDataEvents(dataConnection);
    });

    function setupDataEvents(conn) {
        conn.on('data', (data) => {
            appendChatMessage("Partner", data);
        });
    }

    peer.on('call', (call) => {
        isVideoCallMode = call.metadata && call.metadata.type === 'video';
        updateUIState();

        if (!localStream) {
            navigator.mediaDevices.getUserMedia({ video: isVideoCallMode, audio: true }).then(stream => {
                localStream = stream;
                if (isVideoCallMode) document.getElementById('local-video').srcObject = localStream;
                call.answer(localStream);
                setupCallEvents(call);
            });
        } else {
            call.answer(localStream);
            setupCallEvents(call);
        }
    });

    function setupCallEvents(call) {
        currentCall = call;
        call.on('stream', (remoteStream) => {
            const remoteVideo = document.getElementById('remote-video');
            const remoteAudio = document.getElementById('remote-audio');
            
            if (isVideoCallMode) {
                remoteVideo.style.display = 'block';
                remoteVideo.srcObject = remoteStream;
                document.getElementById('screen-placeholder').style.display = 'none';
            } else {
                remoteVideo.style.display = 'none';
                remoteAudio.srcObject = remoteStream;
                document.getElementById('screen-placeholder').innerText = "Secure Audio Call Active (Voice Only)";
            }
            document.getElementById('status-text').innerText = "Status: Encrypted Live Connection Active";
        });

        call.on('close', () => {
            window.location.reload();
        });
    }

    async function switchCamera() {
        if (!isVideoCallMode) return;
        usingFrontCamera = !usingFrontCamera;

        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
        }

        try {
            const newStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: usingFrontCamera ? 'user' : 'environment' }, 
                audio: true 
            });
            
            localStream = newStream;
            document.getElementById('local-video').srcObject = localStream;
            updateStreamInCall();
        } catch (err) {
            alert("Could not switch camera device.");
        }
    }

    function updateStreamInCall() {
        if (!currentCall || !currentCall.peerConnection) return;
        const videoTrack = localStream.getVideoTracks()[0];
        const senders = currentCall.peerConnection.getSenders();
        const videoSender = senders.find(s => s.track && s.track.kind === 'video');
        if (videoSender && videoTrack) {
            videoSender.replaceTrack(videoTrack);
        }
    }

    function toggleCallType() {
        isVideoCallMode = !isVideoCallMode;
        
        if (currentCall) {
            currentCall.close();
        }
        if (localStream) {
            localStream.getTracks().forEach(t => t.stop());
        }

        initMediaAndConnect();
    }

    function updateUIState() {
        const videoElements = document.querySelectorAll('.video-only');
        const modeBtn = document.getElementById('mode-switch-btn');
        const pipBox = document.getElementById('local-pip-box');

        if (isVideoCallMode) {
            videoElements.forEach(el => el.classList.remove('hidden-by-mode'));
            modeBtn.innerText = "🎧";
            modeBtn.title = "Switch to Audio Call";
            pipBox.style.display = 'block';
        } else {
            videoElements.forEach(el => el.classList.add('hidden-by-mode'));
            modeBtn.innerText = "📹";
            modeBtn.title = "Switch to Video Call";
            pipBox.style.display = 'none';
        }
    }

    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text) return;

        if (dataConnection && dataConnection.open) {
            dataConnection.send(text);
            appendChatMessage("You", text);
            input.value = '';
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    function appendChatMessage(sender, text) {
        const chatBox = document.getElementById('chat-box');
        if (chatBox.children.length === 1 && chatBox.children[0].style.color) {
            chatBox.innerHTML = '';
        }
        const msgDiv = document.createElement('div');
        msgDiv.innerHTML = `<b>${sender}:</b> ${text}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function disconnectCall() {
        if (currentCall) currentCall.close();
        if (dataConnection) dataConnection.close();
        window.location.reload();
    }
</script>
</body>
</html>
