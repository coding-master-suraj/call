<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(17, 24, 39, 0.85);
            --accent: #6366f1;
            --danger: #f43f5e;
            --success: #10b981;
            --power-btn: #22c55e;
            --text-main: #f3f4f6;
            --border: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; box-sizing: border-box;
        }
        h2 { margin: 5px 0 10px 0; font-size: 1.2rem; color: #818cf8; }
        .display-container {
            position: relative; width: 100%; max-width: 480px; aspect-ratio: 9/16; max-height: 52vh;
            background: #030712; border-radius: 16px; overflow: hidden; border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        #remote-video { width: 100%; height: 100%; background: #111; }
        .local-pip {
            position: absolute; top: 15px; right: 15px; width: 90px; height: 130px;
            background: #000; border-radius: 10px; overflow: hidden; border: 2px solid rgba(255,255,255,0.3); z-index: 10;
        }
        .local-pip video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .placeholder-text { position: absolute; color: #6b7280; font-size: 0.9rem; text-align: center; pointer-events: none; }
        .controls-bar {
            display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap;
            max-width: 480px; width: 100%; margin-top: 12px; background: var(--card-bg); padding: 10px; border-radius: 16px; border: 1px solid var(--border);
        }
        .ctrl-btn {
            background: rgba(30, 41, 59, 0.8); border: 1px solid var(--border); color: white;
            width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 18px; transition: all 0.2s;
        }
        .ctrl-btn.partner-switch-btn { width: 56px; height: 42px; border-radius: 22px; font-size: 16px; letter-spacing: 2px; }
        .ctrl-btn:hover { transform: scale(1.08); background: rgba(51, 65, 85, 1); }
        .ctrl-btn.active { background: var(--danger); border-color: var(--danger); }
        .ctrl-btn.disconnect-btn { background: var(--danger); width: 48px; height: 48px; border-radius: 50%; }
        .chat-container {
            max-width: 480px; width: 100%; margin-top: 10px; background: var(--card-bg);
            border: 1px solid var(--border); border-radius: 12px; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px;
        }
        .chat-messages { height: 60px; overflow-y: auto; background: #030712; border-radius: 8px; padding: 6px; font-size: 0.85rem; }
        .chat-input-area { display: flex; gap: 6px; }
        .chat-input-area input {
            flex: 1; background: #030712; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; color: white; font-size: 0.85rem; outline: none;
        }
        .chat-input-area button { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 0 12px; cursor: pointer; font-weight: bold; }
        .status-badge { font-size: 0.8rem; color: #34d399; margin-bottom: 6px; font-weight: 600; }
    
        .location-panel {
            max-width: 480px; width: 100%; margin-top: 10px;
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 14px; padding: 10px; box-sizing: border-box;
        }
        .location-head {
            display:flex; justify-content:space-between; align-items:center;
            gap:8px; font-size:.85rem; font-weight:700; margin-bottom:8px;
        }
        .location-status { color:#34d399; font-size:.75rem; font-weight:600; }
        #location-map {
            width:100%; height:220px; border-radius:10px; overflow:hidden;
            background:#111827; display:none;
        }
        .location-info {
            display:none; margin-top:7px; color:#9ca3af; font-size:.72rem;
            line-height:1.45; word-break:break-word;
        }
        .location-actions { display:flex; gap:7px; margin-top:8px; }
        .location-actions button {
            flex:1; padding:8px 10px; border:1px solid var(--border);
            border-radius:8px; background:rgba(30,41,59,.8); color:white;
            cursor:pointer; font-weight:600;
        }
        .location-actions button.active { background:var(--success); }

    </style>
</head>
<body>

    <h2>Sample Partner</h2>
    <div class="status-badge" id="status-text">Status: Connecting to Server...</div>

    <div id="active-call-container" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="display-container">
            <div class="placeholder-text" id="screen-placeholder">Waiting for Main Camera...</div>
            <video id="remote-video" autoplay playsinline></video>
            <div class="local-pip" id="local-pip-box">
                <video id="local-video" autoplay muted playsinline></video>
            </div>
        </div>

        <div class="controls-bar">
            <button class="ctrl-btn active" id="cam-toggle-btn" onclick="toggleCamera()" title="Camera On/Off">📷</button>
            <button class="ctrl-btn" onclick="switchCamera()" title="Switch Own Camera">🔄</button>
            <button class="ctrl-btn" id="mic-toggle-btn" onclick="toggleMic()" title="Mute/Unmute Voice">🎤</button>
            <button class="ctrl-btn disconnect-btn" onclick="disconnectCall()" title="Disconnect & Shutdown">❌</button>
        </div>

       

        <div class="chat-container">
            <div class="chat-messages" id="chat-box">
                <div style="color: #6b7280;">Live text chat available here...</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="Type a text message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

<script>
    const SAMPLE_ID = "suraj_sample_room_99";
    const MAIN_ID = "suraj_main_room_99";

    let peer = new Peer(SAMPLE_ID, {
        debug: 2,
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        }
    });
    let localStream = null;
    let currentCall = null;
    let dataConnection = null;
    let isCameraActive = true;
    let isMicMuted = false;
    let usingFrontCamera = true;
    let currentResolutionLevel = 'high';
    let locationWatchId = null;
    let isLocationSharing = false;

    peer.on('open', () => {
        document.getElementById('status-text').innerText = "Status: Connecting to Main Connector...";
        autoStartEverything();
    });

    peer.on('error', (err) => {
        console.error('PeerJS error:', err);
        const msg = err && err.type === 'unavailable-id'
            ? 'Partner ID already in use. Close the old Partner tab and reload.'
            : 'Connection error: ' + (err.type || err.message || 'unknown');
        document.getElementById('status-text').innerText = 'Status: ' + msg;
    });

    peer.on('disconnected', () => {
        document.getElementById('status-text').innerText = 'Status: Reconnecting...';
        try { peer.reconnect(); } catch (e) {}
    });

    function autoStartEverything() {
        navigator.mediaDevices.getUserMedia({ 
            video: { width: { ideal: 1280 }, height: { ideal: 720 } }, 
            audio: true 
        }).then(stream => {
            localStream = stream;
            document.getElementById('local-video').srcObject = localStream;
            
            // মেইন কানেক্টরের কাছে কল এবং ডেটা কানেকশন পাঠানো হচ্ছে
            const call = peer.call(MAIN_ID, localStream);
            setupCallEvents(call);
            call.on('error', err => {
                console.error('Outgoing call error:', err);
                document.getElementById('status-text').innerText =
                    'Status: Main Call not reachable';
            });

            dataConnection = peer.connect(MAIN_ID, { reliable: true });
            setupDataEvents(dataConnection);
            dataConnection.on('open', () => {
                document.getElementById('status-text').innerText =
                    'Status: Call/Data Connected ✓';
                setLocationStatus("Requesting permission...", false);
                startLocationSharing();
            });
            dataConnection.on('error', err => {
                console.error('Data connection error:', err);
            });

            startNetworkQualityMonitor();
        }).catch(err => {
            document.getElementById('status-text').innerText = "Status: Camera/Mic permission needed!";
        });
    }

    function setupCallEvents(call) {
        currentCall = call;
        call.on('stream', (remoteStream) => {
            const remoteVideo = document.getElementById('remote-video');
            remoteVideo.srcObject = remoteStream;
            remoteVideo.play().catch(() => {});
            remoteStream.getVideoTracks().forEach(track => {
                track.addEventListener('ended', () => {
                    if (remoteVideo.srcObject === remoteStream) {
                        remoteVideo.pause();
                        remoteVideo.srcObject = null;
                        document.getElementById('screen-placeholder').style.display = 'block';
                    }
                });
            });
            document.getElementById('screen-placeholder').style.display = 'none';
            document.getElementById('status-text').innerText = "Status: Connected Successfully!";
        });
        call.on('close', () => { triggerShutdown(); });
    }

    function setupDataEvents(conn) {
        dataConnection = conn;
        conn.on('data', (data) => {
            if (data === "CMD_SWITCH_CAMERA") {
                switchCamera();
            } else if (data === "CMD_REQUEST_LOCATION") {
                startLocationSharing();
            } else {
                appendChatMessage("Main", data);
            }
        });
    }

    function switchPartnerCamera() {
        if (dataConnection && dataConnection.open) {
            dataConnection.send("CMD_SWITCH_CAMERA");
        }
    }

    function toggleLocationSharing() {
        if (isLocationSharing) stopLocationSharing();
        else startLocationSharing();
    }

    function startLocationSharing() {
        if (!navigator.geolocation) {
            setLocationStatus("GPS not supported", false);
            return;
        }
        if (!dataConnection || !dataConnection.open) {
            setLocationStatus("Waiting for connection...", false);
            return;
        }

        if (isLocationSharing) return;

        setLocationStatus("Requesting permission...", false);

        navigator.geolocation.getCurrentPosition(
            pos => {
                isLocationSharing = true;
                document.getElementById('location-toggle-btn').innerText = "🛑 Location: LIVE";
                document.getElementById('location-toggle-btn').classList.add('active');
                setLocationStatus("LIVE", true);
                sendLocation(pos);

                // Continue sending fresh GPS coordinates automatically.
                locationWatchId = navigator.geolocation.watchPosition(
                    sendLocation,
                    locationError,
                    { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 }
                );
            },
            locationError,
            { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
        );
    }

    function sendLocation(position) {
        if (!dataConnection || !dataConnection.open) return;
        const c = position.coords;
        const payload = {
            type: "location",
            lat: c.latitude,
            lng: c.longitude,
            accuracy: c.accuracy,
            heading: c.heading,
            speed: c.speed,
            timestamp: Date.now()
        };
        dataConnection.send(payload);

        const info = document.getElementById('location-info');
        info.style.display = 'block';
        info.innerText =
            'Sharing: ' + c.latitude.toFixed(6) + ', ' + c.longitude.toFixed(6) +
            ' • Accuracy: ' + Math.round(c.accuracy || 0) + ' m';
    }

    function locationError(err) {
        const messages = {
            1: "Location permission denied",
            2: "Location unavailable",
            3: "Location request timed out"
        };
        setLocationStatus(messages[err.code] || "Location error", false);
    }

    function stopLocationSharing() {
        if (locationWatchId !== null) {
            navigator.geolocation.clearWatch(locationWatchId);
            locationWatchId = null;
        }
        isLocationSharing = false;
        document.getElementById('location-toggle-btn').innerText = "📍 Share Location";
        document.getElementById('location-toggle-btn').classList.remove('active');
        setLocationStatus("Off", false);

        if (dataConnection && dataConnection.open) {
            dataConnection.send({
                type: "location-status",
                active: false,
                message: "Partner stopped sharing location."
            });
        }
    }

    function setLocationStatus(text, active) {
        const el = document.getElementById('location-status');
        if (!el) return;
        el.innerText = text;
        el.style.color = active ? '#34d399' : '#fbbf24';
    }

    function startNetworkQualityMonitor() {
        setInterval(async () => {
            if (!currentCall || !currentCall.peerConnection) return;
            try {
                const stats = await currentCall.peerConnection.getStats();
                let currentRTT = null;
                stats.forEach(report => {
                    if (report.type === 'candidate-pair' && report.state === 'succeeded') {
                        currentRTT = report.currentRoundTripTime;
                    }
                });
                if (currentRTT !== null) {
                    if (currentRTT > 0.35 && currentResolutionLevel !== 'low') {
                        setCameraResolution('low');
                    } else if (currentRTT > 0.2 && currentRTT <= 0.35 && currentResolutionLevel !== 'medium') {
                        setCameraResolution('medium');
                    } else if (currentRTT <= 0.2 && currentResolutionLevel !== 'high') {
                        setCameraResolution('high');
                    }
                }
            } catch (e) {}
        }, 4000);
    }

    async function setCameraResolution(level) {
        if (!localStream) return;
        let constraints = level === 'low' ? { width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { max: 15 } } :
                          level === 'medium' ? { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { max: 24 } } :
                          { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { max: 30 } };
        currentResolutionLevel = level;
        try {
            await localStream.getVideoTracks()[0].applyConstraints(constraints);
        } catch (e) {}
    }

    async function toggleCamera() {
        const camBtn = document.getElementById('cam-toggle-btn');
        const pipBox = document.getElementById('local-pip-box');
        const localVideo = document.getElementById('local-video');
        if (!isCameraActive) {
            if (localStream) {
                localStream.getVideoTracks()[0].enabled = true;
                localVideo.srcObject = localStream;
                pipBox.style.display = 'block';
                isCameraActive = true;
                camBtn.classList.add('active');
                updateStreamInCall();
            }
        } else {
            if (localStream) {
                const oldTrack = localStream.getVideoTracks()[0];
                if (oldTrack) oldTrack.enabled = false;
            }
            localVideo.pause();
            localVideo.srcObject = null;
            pipBox.style.display = 'none';
            isCameraActive = false;
            replaceOutgoingVideoWithBlackTrack();
            camBtn.classList.remove('active');
        }
    }

    function toggleMic() {
        if (!localStream) return;
        isMicMuted = !isMicMuted;
        localStream.getAudioTracks().forEach(t => t.enabled = !isMicMuted);
        const micBtn = document.getElementById('mic-toggle-btn');
        micBtn.classList.toggle('active', isMicMuted);
        micBtn.innerText = isMicMuted ? "🔇" : "🎤";
    }

    async function switchCamera() {
        usingFrontCamera = !usingFrontCamera;
        try {
            const newStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: usingFrontCamera ? 'user' : 'environment' }, audio: true 
            });
            localStream.getVideoTracks().forEach(t => t.stop());
            localStream = newStream;
            if (isCameraActive) document.getElementById('local-video').srcObject = localStream;
            updateStreamInCall();
        } catch (e) {}
    }

    let blackVideoTrack = null;

    function getBlackVideoTrack() {
        if (blackVideoTrack && blackVideoTrack.readyState === 'live') return blackVideoTrack;
        const canvas = document.createElement('canvas');
        canvas.width = 640; canvas.height = 360;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        blackVideoTrack = canvas.captureStream(5).getVideoTracks()[0];
        return blackVideoTrack;
    }

    async function replaceOutgoingVideoWithBlackTrack() {
        if (!currentCall || !currentCall.peerConnection) return;
        const sender = currentCall.peerConnection.getSenders()
            .find(s => s.track && s.track.kind === 'video');
        if (sender) {
            try { await sender.replaceTrack(getBlackVideoTrack()); } catch (e) {}
        }
    }

    async function updateStreamInCall() {
        if (!currentCall || !currentCall.peerConnection || !localStream) return;
        const videoTrack = isCameraActive
            ? localStream.getVideoTracks()[0]
            : getBlackVideoTrack();
        const sender = currentCall.peerConnection.getSenders()
            .find(s => s.track && s.track.kind === 'video');
        if (sender && videoTrack) {
            try { await sender.replaceTrack(videoTrack); } catch (e) {}
        }
    }

    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text || !dataConnection || !dataConnection.open) return;
        dataConnection.send(text);
        appendChatMessage("You", text);
        input.value = '';
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    function appendChatMessage(sender, text) {
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML += `<div><b>${sender}:</b> ${text}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }
    function disconnectCall() {
        stopLocationSharing();
        window.location.reload();
    }

    window.addEventListener('beforeunload', () => {
        if (locationWatchId !== null) {
            navigator.geolocation.clearWatch(locationWatchId);
        }
        if (blackVideoTrack) blackVideoTrack.stop();
    });
    function triggerShutdown() { document.getElementById('status-text').innerText = "Status: Disconnected"; }
</script>
</body>
</html>
